<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="The Sold Collective agent portal for forms, resources, and the BOLD Truths.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TSC Portal">
    <title>TSC Agent Portal</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("tsc-portal-theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#211F1F" : "#ffffff");
        } catch (error) {}
      })();
    </script>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="icons/icon-512.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip" href="#panel">Skip to content</a>
    <div class="app">
      <header class="brand">
        <div class="brand-row">
          <img class="wordmark" src="assets/wordmark.png" width="1280" height="339" alt="The Sold Collective">
          <div class="brand-actions">
            <button type="button" id="share" class="icon-btn" aria-label="Share this app">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M12 16V4M8 8l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M6 10v8a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
            <button type="button" id="theme" class="icon-btn" aria-label="Switch color theme">
              <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
                <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4L19 19M19 5l-1.6 1.6M6.6 17.4L5 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              </svg>
              <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M16 3.2A8.5 8.5 0 1 0 20.8 14 7 7 0 0 1 16 3.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="welcome"></div>
      </header>

      <div class="install" id="install" hidden>
        <p id="install-copy"></p>
        <div class="install-actions">
          <button type="button" id="install-go" hidden>Install app</button>
          <button type="button" id="install-dismiss" class="ghost">Not now</button>
        </div>
      </div>

      <div class="sticky">
        <form id="search-form" class="search" role="search">
          <label class="sr-only" for="q">Search forms, resources, and BOLD Truths</label>
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
          <input id="q" type="search" name="q" placeholder="Search forms, resources, truths" enterkeyhint="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button type="button" id="clear" class="icon-btn clear" hidden aria-label="Clear search">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
          </button>
        </form>
      </div>

      <p class="meta" id="meta" aria-live="polite"></p>

      <main id="panel" tabindex="0">
        <p class="loading">Loading portal…</p>
      </main>

      <footer class="foot">
        <button type="button" id="install-link">Add to Home Screen</button>
        <p>Links open in a new tab.</p>
      </footer>

      <p class="status" id="status" hidden role="status">You’re offline. This page is saved on your phone. Pull to refresh when you are back online.</p>

      <nav class="dock" aria-label="Primary">
        <button type="button" id="nav-home" data-view="home" aria-current="page">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
          </svg>
          Home
        </button>
        <button type="button" id="nav-resources" data-view="resources">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
          </svg>
          Resources
        </button>
        <button type="button" id="nav-team" data-view="team">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <circle cx="9" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.8M16 4.1a3.2 3.2 0 0 1 0 6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
          Team
        </button>
        <button type="button" id="nav-search" data-view="search">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
          Search
        </button>
      </nav>
    </div>
    <p class="toast" id="toast" hidden role="status"></p>
    <script src="app.js"></script>
  </body>
</html>
